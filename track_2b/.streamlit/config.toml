# Configuration Streamlit (lue quand l'app est lancée depuis track_2b/)
[browser]
# Pas de statistiques d'utilisation envoyées à Streamlit
gatherUsageStats = false

[server]
# En local, l'app n'est accessible que depuis cet ordinateur (elle utilise ta clé API).
# Dans Docker, lancer avec --server.address 0.0.0.0 (l'option de la commande l'emporte).
address = "localhost"

[theme]
# Sobre : un seul bleu d'accent, gris pour les zones secondaires (voir src/style.py).
# Deux thèmes : l'app suit le réglage clair/sombre de l'ordinateur ; on peut aussi choisir
# dans le menu ⋮ > Settings.
font = "sans-serif"
baseRadius = "12px"

[theme.light]
primaryColor = "#0071e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
borderColor = "#d2d2d7"
linkColor = "#0071e3"

[theme.light.sidebar]
backgroundColor = "#f5f5f7"

[theme.dark]
primaryColor = "#2997ff"
backgroundColor = "#111113"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
borderColor = "#3a3a3c"
linkColor = "#2997ff"

[theme.dark.sidebar]
backgroundColor = "#1c1c1e"
